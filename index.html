  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));

    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.

      }
      return map;

      for (const uuid of uuids) t = t.split(uuid).join(blobUrls[uuid]);

      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.
      // composedPath + getAttribute('target') handle SVG <a> and shadow-DOM
      // anchors, which closest()/IDL .target get wrong.

            'var tg = a.getAttribute("target");' +

            'if (h.charAt(0) !== "#") {' +

              'e.preventDefault();' +

              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');
      // Defuse any script end-tag sequence in the content (resource ids, page
      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>
      // (synthesizing one if the source HTML omitted it) but may carry
      // attributes through, so match the full opening tag.

      if (headOpen) {
        var hi = headOpen.index + headOpen[0].length;
        t = t.slice(0, hi) + headScript + t.slice(hi);
      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).

      const doc = new DOMParser().parseFromString(template, 'text/html');
      document.documentElement.replaceWith(doc.documentElement);
      const dead = Array.from(document.scripts);
      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.
        if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

size:clamp(1.8rem,3vw,2.8rem);font-weight:600;margin-bottom:1.4rem;line-height:1.15;\">Designing with intent.<br>Crafting with soul.<\u002Fh2>\n        <p style=\"color:#a3a399;font-size:.96rem;margin-bottom:1.2rem;\">I'm a Cape Town–based Digital &amp; Graphic Designer with a passion for turning complex ideas into clean, compelling visuals. With over a decade of experience across branding, UI/UX, editorial, and motion design, I bring a rare blend of strategic thinking and creative excellence.<\u002Fp>\n        <p style=\"color:#a3a399;font-size:.96rem;margin-bottom:1.2rem;\">My work is rooted in the belief that great design doesn't just look beautiful — it communicates, connects, and converts. From global brand identities to pixel-perfect digital interfaces, every project is an opportunity to make something truly memorable.<\u002Fp>\n\n        <div data-r=\"about-cols\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;margin-top:2.5rem;\">\n          <div>\n            <h4 style=\"font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;color:#C9A84C;margin-bottom:1rem;letter-spacing:.03em;\">Experience<\u002Fh4>\n            <ul>\n              <sc-for list=\"{{ experience }}\" as=\"job\" hint-placeholder-count=\"5\">\n                <li style=\"padding:.6rem 0;border-bottom:1px solid #222;font-size:.88rem;\"><span style=\"display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;\"><strong style=\"color:#f5f0e8;font-weight:500;\">{{ job.name }}<\u002Fstrong><small style=\"font-size:.7rem;letter-spacing:.06em;color:#C9A84C;white-space:nowrap;\">{{ job.dates }}<\u002Fsmall><\u002Fspan><span style=\"font-size:.8rem;color:#888880;\">{{ job.role }}<\u002Fspan><\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div>\n            <h4 style=\"font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;color:#C9A84C;margin-bottom:1rem;letter-spacing:.03em;\">Skills<\u002Fh4>\n            <div style=\"display:flex;flex-wrap:wrap;gap:.6rem;\">\n              <sc-for list=\"{{ skills }}\" as=\"skill\" hint-placeholder-count=\"8\">\n                <span style=\"font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid #222;padding:.35rem .9rem;color:#888880;transition:.2s;\" style-hover=\"border-color:#C9A84C;color:#C9A84C;\">{{ skill }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WORKS -->\n  <section id=\"works\" data-r=\"section\" style=\"background:#0b0b0b;padding:7rem 4rem;\">\n    <div style=\"text-align:center;margin-bottom:4rem;\">\n      <span style=\"font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:#C9A84C;display:block;margin-bottom:.6rem;\">Portfolio<\u002Fspan>\n      <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4vw,3.2rem);font-weight:600;line-height:1.15;\">Selected Works.<\u002Fh2>\n      <div style=\"width:40px;height:2px;background:#C9A84C;margin:1.2rem auto 0;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-r=\"works-grid\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:1200px;margin:0 auto;\">\n      <sc-for list=\"{{ works }}\" as=\"work\" hint-placeholder-count=\"6\">\n        <div data-fade=\"\" style=\"position:relative;aspect-ratio:4/3;background:repeating-linear-gradient(45deg,#141414,#141414 12px,#191919 12px,#191919 24px);overflow:hidden;\">\n          <span style=\"position:absolute;top:1rem;left:1rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.6rem;letter-spacing:.08em;color:#46463f;text-transform:uppercase;\">image · 4:3<\u002Fspan>\n          <div style=\"position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 30%,rgba(0,0,0,.15) 70%,transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:1.6rem;\">\n            <s  1fr 1fr;gap:4rem;max-width:1100px;margin:0 auto 5rem;padding-bottom:4rem;border-bottom:1px solid #222;\">\n      <div>\n        <span style=\"font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:#C9A84C;display:block;margin-bottom:.6rem;\">Get In Touch<\u002Fspan>\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:600;margin-bottom:1rem;line-height:1.12;\">Let's Create<br>Something Great.<\u002Fh2>\n        <p style=\"color:#a3a399;font-size:.92rem;max-width:400px;margin-bottom:2rem;\">Have a project in mind? Let's talk about how great design can take your brand to the next level. I'm available for select freelance and collaborative projects.<\u002Fp>\n        <div style=\"display:flex;gap:1rem;flex-wrap:wrap;\">\n          <a href=\"mailto:lgold46@gmail.com\" style=\"display:inline-block;padding:.85rem 2.2rem;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:.25s;background:#C9A84C;color:#0b0b0b;\" style-hover=\"background:#e2c070;\">Message Me<\u002Fa>\n          <a href=\"https://drive.google.com/file/d/1L-SLsI66qD68VnEpE5VGQQwf4lJWyeTL/view?usp=drive_link\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;padding:.85rem 2.2rem;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:border-color .3s ease, color .3s ease;border:1px solid rgba(255,255,255,.3);color:#f5f0e8;\" style-hover=\"border-color:#C9A84C;color:#C9A84C;\">Download CV<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#C9A84C;margin-bottom:1.2rem;\">Follow Me<\u002Fh4>\n        <ul>\n          <sc-for list=\"{{ socials }}\" as=\"s\" hint-placeholder-count=\"2\">\n            <li style=\"padding:.35rem 0;font-size:.9rem;\"><a href=\"{{ s.url }}\" target=\"_blank\" rel=\"noopener\" style=\"color:#888880;transition:.2s;\" style-hover=\"color:#C9A84C;\">{{ s.name }}<\u002Fa><\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#C9A84C;margin-bottom:1.2rem;\">Contact<\u002Fh4>\n        <ul>\n          <li style=\"padding:.35rem 0;font-size:.9rem;\"><a href=\"mailto:lgold46@gmail.com\" style=\"color:#888880;transition:.2s;\" style-hover=\"color:#C9A84C;\">lgold46@gmail.com<\u002Fa><\u002Fli>\n          <li style=\"padding:.35rem 0;font-size:.9rem;\"><a href=\"tel:+27834438660\" style=\"color:#888880;transition:.2s;\" style-hover=\"color:#C9A84C;\">+27 83 443 8660<\u002Fa><\u002Fli>\n          <li style=\"color:#888880;font-size:.85rem;margin-top:.5rem;\">Cape Town, South Africa<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-r=\"footer-bottom\" style=\"max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:#888880;gap:1rem;\">\n      <p>© {{ year }} Lorenzo Gold. All rights reserved.<\u002Fp>\n      <div style=\"display:flex;gap:1.2rem;\">\n        <a href=\"https://www.behance.net/Lgold/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#888880;transition:.2s;\" style-hover=\"color:#C9A84C;\">Behance<\u002Fa>\n        <a href=\"https://www.linkedin.com/in/lorenzo-gold/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#888880;transition:.2s;\" style-hover=\"color:#C9A84C;\">LinkedIn<\u002Fa>\n      <\u002Fdiv>\n      <a href=\"#intro\" title=\"Back to top\" style=\"width:44px;height:44px;border:1px solid #222;display:flex;align-items:center;justify-content:center;color:#888880;font-size:1rem;transition:.25s;flex-shrink:0;\" style-hover=\"border-color:#C9A84C;color:#C9A84C;\">↑<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:900},&quot;showStats&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showCvRibbon&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { scrolled: false, navOpen: false, isMobile: false };\n\n  componentDidMount() {\n    this._onScroll = () => {\n      const s = window.scrollY > 60;\n      if (s !== this.state.scrolled) this.setState({ scrolled: s });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n\n    this._mq = window.matchMedia('(max-width:960px)');\n    this._onMq = (e) => this.setState({ isMobile: e.matches, navOpen: false });\n    this.setState({ isMobile: this._mq.matches });\n    this._mq.addEventListener('change', this._onMq);\n\n    this._setupCounters();\n    this._setupFade();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._mq) this._mq.removeEventListener('change', this._onMq);\n  }\n\n  _setupCounters() {\n    const counters = document.querySelectorAll('[data-count]');\n    const obs = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (!entry.isIntersecting) return;\n        const el = entry.target;\n        const target = +el.dataset.count;\n        let count = 0;\n        const step = Math.max(1, Math.ceil(target / 60));\n        const t = setInterval(() => {\n          count = Math.min(count + step, target);\n          el.textContent = count + '+';\n          if (count >= target) clearInterval(t);\n        }, 20);\n        obs.unobserve(el);\n      });\n    }, { threshold: 0.5 });\n    counters.forEach((c) => obs.observe(c));\n  }\n\n  _setupFade() {\n    const els = document.querySelectorAll('[data-fade]');\n    const obs = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          obs.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.12 });\n    els.forEach((el) => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(24px)';\n      el.style.transition = 'opacity .6s ease, transform .6s ease';\n      obs.observe(el);\n    });\n  }\n\n  renderVals() {\n    const { scrolled, navOpen, isMobile } = this.state;\n    const padX = isMobile ? '2rem' : '4rem';\n\n    const headerStyle = {\n      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,\n      display: 'flex', alignItems: 'center', justifyContent: 'space-between',\n      padding: (scrolled ? '1rem ' : '1.5rem ') + padX,\n      transition: 'background .4s, padding .4s',\n      background: scrolled ? 'rgba(11,11,11,.94)' : 'transparent',\n      backdropFilter: (scrolled && !isMobile) ? 'blur(12px)' : 'none',\n      WebkitBackdropFilter: (scrolled && !isMobile) ? 'blur(12px)' : 'none',\n      borderBottom: scrolled ? '1px solid #222' : '1px solid transparent'\n    };\n\n    let navListStyle;\n    if (!isMobile) {\n      navListStyle = { display: 'flex', gap: '2.5rem' };\n    } else if (navOpen) {\n      navListStyle = {\n        display: 'flex', flexDirection: 'column', position: 'fixed', inset: 0,\n        background: 'rgba(11,11,11,.97)', alignItems: 'center', justifyContent: 'center',\n        gap: '2rem', zIndex: 99, fontSize: '1.1rem'\n      };\n    } else {\n      navListStyle = { display: 'none' };\n    }\n\n    const toggleStyle = isMobile\n      ? { display: 'flex', flexDirection: 'column', gap: '5px', cursor: 'pointer', zIndex: 100, marginLeft: 'auto' }\n      : { display: 'none' };\n\n    return {\n      headerStyle, navListStyle, toggleStyle,\n      toggleNav: () => this.setState((s) => ({ navOpen: !s.navOpen })),\n      closeNav: () => this.setState({ navOpen: false }),\n      showStats: this.props.showStats ?? true,\n      showCvRibbon: this.props.showCvRibbon ?? true,\n      year: new Date().getFullYear(),\n      experience: [\n        { name: 'Hungry Lion', dates: '2024 — Present', role: 'Senior Designer' },\n        { name: 'Lux Afrique Boutique', dates: '2024', role: 'Creative Lead & Manager' },\n        { name: 'Shimansky', dates: '2022 — 2024', role: 'Senior Designer' },\n        { name: 'Le Creuset', dates: '2022', role: 'Senior Digital Designer' },\n        { name: 'Rogerwilco', dates: '2018 — 2022', role: 'Senior Designer — Digital & UI' },\n        { name: 'iFix · weFix', dates: '2016 — 2018', role: 'Graphic Designer' },\n        { name: 'Full Circle Communications', dates: '2012 — 2016', role: 'Graphic Designer' }\n      ],\n      awards: [\n        { title: 'Site Of The Month', org: 'Awwwards — 2024' },\n        { title: 'FWA of The Day', org: 'FWA — 2024' },\n        { title: 'Agency of The Year', org: 'Awwwards — 2023' },\n        { title: 'Site Of The Month', org: 'Awwwards — 2023' },\n        { title: 'Cannes Lions Finalist', org: 'D&AD — 2022' }\n      ],\n      skills: ['Brand Identity', 'UI/UX Design', 'Digital Design', 'AI & Integration', 'Motion Graphics', 'Typography', 'Illustration', 'Art Direction', 'Print Design', 'Visual Strategy'],\n      works: [\n        { cat: 'Brand Identity', title: 'Aurum Studio', desc: 'Full brand identity system for a luxury creative studio — logo, palette, and collateral.' },\n        { cat: 'UI/UX Design', title: 'Vela Digital', desc: 'End-to-end UX design for a fintech SaaS platform, from wireframes to pixel-perfect UI.' },\n        { cat: 'Print & Editorial', title: 'Bloom Magazine', desc: 'Art direction and layout design for a seasonal arts & culture editorial publication.' },\n        { cat: 'Motion & Animation', title: 'Nox Motion Reel', desc: 'Motion graphics package for a leading events company — title sequences and looping visuals.' },\n        { cat: 'Typography', title: 'Kōan Typeface', desc: 'Custom display typeface designed for a Japanese-inspired luxury wellness brand.' },\n        { cat: 'Brand Identity', title: 'Apex Campaign', desc: '360° brand campaign for a global sports performance brand across digital and OOH.' }\n      ],\n      stats: [\n        { target: 95, label: 'Happy Clients', desc: \"Brands and studios who trust my creative vision to elevate their presence.\" },\n        { target: 500, label: 'Projects Completed', desc: 'From brand identities to full digital platforms, every project delivered with precision.' },\n        { target: 12, label: 'Years of Experience', desc: 'Over a decade of crafting design solutions across branding, digital, print and motion.' }\n      ],\n      socials: [\n        { name: 'Behance', url: 'https://www.behance.net/Lgold/' },\n        { name: 'LinkedIn', url: 'https://www.linkedin.com/in/lorenzo-gold/' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"Lorenzo Gold.dc"}
